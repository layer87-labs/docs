name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly run on the default branch to catch drift (new dependency releases, broken external tooling).
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint Markdown
        run: pnpm run lint:md

      - name: Build site (fails on broken links, anchors and warnings)
        env:
          NO_COLOR: '1'
        run: |
          pnpm run build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -F '[WARNING]' build.log; then
            echo '::error::The build log contains [WARNING] lines (see above). Fix them or the build is not clean.'
            exit 1
          fi

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        env:
          CI: 'true'
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
